# Backtest delle regole sui dati veri di Yahoo (si avvia a mano: Actions -> Backtest -> Run workflow)
name: Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sentinella.txt
      - run: pip install -r requirements-sentinella.txt
      - name: Backtest sugli ultimi 3 anni
        run: python backtest.py
