# Prova dei filtri su eventi (conti, Fed) e tensione (VIX): servono davvero? Solo a mano.
# L'esito va in prova_filtri.json sul branch dati.
name: Prova filtri

on:
  workflow_dispatch:

permissions:
  contents: write              # per salvare l'esito sul branch dati

jobs:
  ricerca:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sentinella.txt
      - run: pip install -r requirements-sentinella.txt
      - name: Prova dei filtri su eventi e tensione
        run: pip install lxml && python prova_filtri.py
      - name: Salva l'esito sul branch dati
        run: bash strumenti/memoria.sh salva prova_filtri.json
