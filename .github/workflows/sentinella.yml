# Sentinella, GIRO SINGOLO a mano (prove e messaggio di benvenuto): Actions -> Sentinella -> Run workflow.
# Il lavoro continuo ogni 30 minuti lo fa il workflow "Motore" (motore.yml).
name: Sentinella

on:
  workflow_dispatch:
    inputs:
      prova:
        description: "Manda un messaggio di prova con il riepilogo"
        type: boolean
        default: true

concurrency:
  group: sentinella
  cancel-in-progress: false

permissions:
  contents: write              # per salvare la memoria sul branch "dati"

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: "375765601"
      # Chiavi del conto DEMO Capital.com (modalità automatica). Se mancano, solo avvisi.
      CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
      CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
      CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      # Capitale, rischio, orari e modalità si cambiano in piano.json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sentinella.txt

      - name: Installa le librerie
        run: pip install -r requirements-sentinella.txt

      - name: Recupera la memoria della sentinella
        uses: actions/cache/restore@v4
        with:
          path: stato_sentinella.json
          key: stato-${{ github.run_id }}
          restore-keys: stato-

      - name: Carica la memoria dal branch dati
        run: bash strumenti/memoria.sh carica

      - name: Giro di controllo
        run: python sentinella.py ${{ github.event_name == 'workflow_dispatch' && inputs.prova && '--prova' || '' }}

      - name: Salva la memoria sul branch dati
        if: always()
        run: bash strumenti/memoria.sh salva

      - name: Salva la memoria della sentinella
        if: always()
        uses: actions/cache/save@v4
        with:
          path: stato_sentinella.json
          key: stato-${{ github.run_id }}
