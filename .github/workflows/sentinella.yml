# La sentinella: controlla i mercati ogni 30 minuti e scrive su Telegram.
# Non invia ordini. Si può anche avviare a mano da GitHub: Actions -> Sentinella -> Run workflow.
name: Sentinella

on:
  schedule:
    - cron: "7,37 * * * *"     # ogni 30 minuti (al minuto 7 e 37, per evitare l'ora di punta di GitHub)
  workflow_dispatch:
    inputs:
      prova:
        description: "Manda un messaggio di prova con il riepilogo"
        type: boolean
        default: true

concurrency:
  group: sentinella
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: "375765601"
      # Capitale, rischio e orari degli avvisi si cambiano in piano.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sentinella.txt

      - name: Installa le librerie
        run: pip install -r requirements-sentinella.txt

      - name: Recupera la memoria della sentinella
        uses: actions/cache/restore@v4
        with:
          path: stato_sentinella.json
          key: stato-${{ github.run_id }}
          restore-keys: stato-

      - name: Giro di controllo
        run: python sentinella.py ${{ github.event_name == 'workflow_dispatch' && inputs.prova && '--prova' || '' }}

      - name: Salva la memoria della sentinella
        if: always()
        uses: actions/cache/save@v4
        with:
          path: stato_sentinella.json
          key: stato-${{ github.run_id }}
