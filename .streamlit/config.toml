# Nessun tema fisso: l'app segue l'impostazione del telefono (chiaro di giorno, scuro di notte).

[server]
# Permette di aprire l'app dal telefono sulla stessa rete Wi-Fi quando gira sul PC
address = "0.0.0.0"
port = 8501

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Due temi: Streamlit sceglie quello del telefono
[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f4f4f1"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b0b0b"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#111312"
secondaryBackgroundColor = "#1b1e1d"
textColor = "#f0efec"
